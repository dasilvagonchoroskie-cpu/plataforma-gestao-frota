name: Esteira

# A cada envio: testa o banco num Supabase local (migrations do zero + testes
# pgTAP), o núcleo de regras e os dois apps; compila os APKs e publica o
# painel web do gestor no ramo gh-pages (GitHub Pages) e abre os dois APKs num
# emulador Android para garantir que eles abrem de verdade. Os registros de cada parte ficam no Release
# "registros" (para conferir de fora do GitHub).
on:
  push:
    branches: [main]
    # Tudo menos ferramentas, documentos e textos; o script de backup entra (o job Banco testa).
    paths: ['**', '!ferramentas/**', 'ferramentas/backup/**', '!docs/**', '!**.md']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  banco:
    name: Banco (migrations e testes pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Subir o Supabase local com as migrations
        run: |
          set -o pipefail
          mkdir -p registros
          supabase --version 2>&1 | tee registros/banco.log
          supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector 2>&1 | tee -a registros/banco.log
      - name: Testes do banco
        run: |
          set -o pipefail
          BANCO_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bash supabase/tests/local/rodar.sh 2>&1 | tee -a registros/banco.log
      - name: Testes das Edge Functions (login por CPF e redefinir acesso)
        run: |
          set -o pipefail
          bash supabase/tests/funcoes/testar.sh 2>&1 | tee -a registros/banco.log
      - name: Testar o backup criptografado (banco local) e o agendamento da limpeza
        run: |
          set -o pipefail
          export BACKUP_SENHA="$(openssl rand -hex 24)"
          ALVO=--local bash ferramentas/backup/fazer_backup.sh /tmp/backup-teste 2>&1 | tee -a registros/banco.log
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -tA \
            -c "select 'pg_cron: ' || coalesce(string_agg(jobname || ' ' || schedule, ', '), 'nenhum') from cron.job" \
            -c "select 'limpeza_modo: ' || valor from public.configuracao_plataforma where chave = 'limpeza_modo'" \
            2>&1 | tee -a registros/banco.log
      - name: Guardar o registro
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/banco.log
          gh release view registros >/dev/null 2>&1 || gh release create registros --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros registros/banco.log --clobber
      - name: Parar
        if: always()
        run: supabase stop --no-backup || true

  nucleo:
    name: Núcleo de regras (análise e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Análise e testes
        working-directory: packages/nucleo
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (dart pub get && dart analyze --fatal-infos && dart test) 2>&1 | tee ../../registros/nucleo.log
      - name: Guardar o registro
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/nucleo.log
          gh release view registros >/dev/null 2>&1 || gh release create registros --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros registros/nucleo.log --clobber

  motorista:
    name: App do motorista (análise, testes e APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependências, análise e testes
        working-directory: apps/motorista
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (flutter pub get && flutter analyze --no-fatal-infos && flutter test --exclude-tags capturas) 2>&1 | tee ../../registros/motorista.log
      - name: Imagens das telas
        working-directory: apps/motorista
        continue-on-error: true
        run: flutter test --tags capturas --update-goldens 2>&1 | tail -5
      - name: Compilar o APK de teste
        working-directory: apps/motorista
        run: |
          set -o pipefail
          NUMERO=$((100 + ${{ github.run_number }}))
          flutter build apk --release --build-number=$NUMERO 2>&1 | tee -a ../../registros/motorista.log
          mkdir -p ../../saida
          cp build/app/outputs/flutter-apk/app-release.apk ../../saida/Frota-Motorista.apk
          (cd test && zip -qr ../../../saida/telas-motorista.zip capturas) || true
          ls -la ../../saida
      - name: Publicar o APK de teste (Release "motorista-teste")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view motorista-teste >/dev/null 2>&1 || gh release create motorista-teste --prerelease \
            --title "App do motorista - teste" --notes "APK de teste do app do motorista (chave de teste). Versão da esteira."
          gh release upload motorista-teste saida/Frota-Motorista.apk --clobber
          [ -f saida/telas-motorista.zip ] && gh release upload motorista-teste saida/telas-motorista.zip --clobber || true
          echo "commit ${GITHUB_SHA::7} | APK publicado" >> registros/motorista.log
      - name: Guardar o registro
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/motorista.log
          gh release view registros >/dev/null 2>&1 || gh release create registros --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros registros/motorista.log --clobber

  gestor:
    name: App e painel do gestor (análise, testes, APK e site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependências, análise e testes
        working-directory: apps/gestor
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (flutter pub get && flutter analyze --no-fatal-infos && flutter test --exclude-tags capturas) 2>&1 | tee ../../registros/gestor.log
      - name: Imagens das telas
        working-directory: apps/gestor
        continue-on-error: true
        run: flutter test --tags capturas --update-goldens 2>&1 | tail -5
      - name: Compilar o painel web
        working-directory: apps/gestor
        run: |
          set -o pipefail
          flutter build web --release --base-href /plataforma-gestao-frota/ 2>&1 | tail -5 | tee -a ../../registros/gestor.log
      - name: Compilar o APK de teste
        working-directory: apps/gestor
        run: |
          set -o pipefail
          NUMERO=$((100 + ${{ github.run_number }}))
          flutter build apk --release --build-number=$NUMERO 2>&1 | tail -5 | tee -a ../../registros/gestor.log
          mkdir -p ../../saida
          cp build/app/outputs/flutter-apk/app-release.apk ../../saida/Frota-Gestor.apk
          (cd test && zip -qr ../../../saida/telas-gestor.zip capturas) || true
          ls -la ../../saida
      - name: Publicar o APK de teste (Release "gestor-teste")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view gestor-teste >/dev/null 2>&1 || gh release create gestor-teste --prerelease \
            --title "App do gestor - teste" --notes "APK de teste do app do gestor e do dono (chave de teste). Versão da esteira."
          gh release upload gestor-teste saida/Frota-Gestor.apk --clobber
          [ -f saida/telas-gestor.zip ] && gh release upload gestor-teste saida/telas-gestor.zip --clobber || true
          echo "commit ${GITHUB_SHA::7} | APK publicado" >> registros/gestor.log
      - name: Publicar o painel web (ramo gh-pages)
        run: |
          cd apps/gestor/build/web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "esteira"
          git config user.email "esteira@users.noreply.github.com"
          git add -A
          git commit -q -m "Painel web do gestor (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "commit ${GITHUB_SHA::7} | painel web publicado no ramo gh-pages" >> ../../../../registros/gestor.log
      - name: Conferir as Edge Functions na nuvem
        continue-on-error: true
        run: |
          F=https://uinvhwhqhudniipobslu.supabase.co/functions/v1
          K='apikey: sb_publishable_nM7GeKdmBtrk7VxUBk6s3A_e9Yc9Mdn'
          conferir() { # nome corpo esperado
            CODIGO=$(curl -s -o resposta.json -w '%{http_code}' -X POST "$F/$1" -H 'Content-Type: application/json' -H "$K" -d "$2")
            [ "$CODIGO" = "$3" ] && R=ok || R=FALHOU
            echo "$R: $1 respondeu $CODIGO (esperado $3): $(cat resposta.json)" | tee -a registros/gestor.log
          }
          # Só pedidos recusados na validação: nada é gravado no banco.
          conferir entrar_com_cpf '{"cpf":"123","senha":"x","aparelho":"esteira"}' 401
          conferir cadastrar_motorista '{"nome":"Teste","cpf":"123","senha":"x","aparelho":"esteira"}' 400
          conferir redefinir_acesso '{}' 401
          conferir criar_acesso_gestor '{}' 401
          conferir recuperar_acesso '{"identificador":"123","codigo":"x","senha_nova":"x"}' 400
      - name: Guardar o registro
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/gestor.log
          gh release view registros >/dev/null 2>&1 || gh release create registros --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros registros/gestor.log --clobber

  aparelho:
    name: Abrir os dois APKs num celular Android (emulador)
    needs: [motorista, gestor]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Liberar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baixar os APKs desta execução
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apks
          gh release download motorista-teste -p 'Frota-Motorista.apk' -D apks
          gh release download gestor-teste -p 'Frota-Gestor.apk' -D apks
      - name: Abrir os apps no Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ferramentas/diagnostico/rodar.sh
      - name: Guardar o resultado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostico
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> diagnostico/resumo.txt
          zip -qr diagnostico.zip diagnostico
          gh release upload registros diagnostico.zip --clobber
