name: Esteira

# A cada envio: testa o banco num Supabase local (migrations do zero + testes
# pgTAP + testes das Edge Functions + backup e restauração), o núcleo de regras
# e os dois apps; compila os APKs (assinados com a chave derivada da
# CHAVE_MESTRA), confere que não levam segredo, abre os dois num emulador
# Android e só então publica. O painel web vai para o ramo gh-pages.
# Os registros de cada parte ficam no Release "registros".
# Pedidos de atualização (Dependabot) rodam os mesmos testes, sem publicar nada.
on:
  push:
    branches: [main]
    # Tudo menos ferramentas, documentos e textos; os scripts usados aqui entram.
    paths: ['**', '!ferramentas/**', 'ferramentas/backup/**', 'ferramentas/chaves/**',
            'ferramentas/seguranca/**', 'ferramentas/diagnostico/**', 'ferramentas/legal/**',
            '!docs/**', 'docs/legal/**', '!**.md']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cada job pede só a permissão que usa.
permissions: {}

# Um envio novo cancela a execução anterior ainda rodando (a versão mais nova é
# a que vale e nada velho é publicado por cima dela).
concurrency:
  group: esteira-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  SUPABASE_CLI_VERSION: '2.121.0'
  PUBLICAR: ${{ github.event_name != 'pull_request' }}
  # Repositório público só com o painel web (o código pode ficar privado).
  # Com o segredo PAINEL_TOKEN, o painel vai para lá; sem ele, para o ramo
  # gh-pages deste repositório (docs/REPOSITORIO-PRIVADO.md).
  PAINEL_REPO_NOME: painel-frota

jobs:
  banco:
    name: Banco (migrations, testes, backup e restauração)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # guardar o registro no Release "registros"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Migrations que apagam dados têm aprovação do dono
        run: python3 ferramentas/seguranca/conferir_aprovacao.py supabase/migrations
      - name: Subir o Supabase local com as migrations
        run: |
          set -o pipefail
          mkdir -p registros
          supabase --version 2>&1 | tee registros/banco.log
          # As chaves do Supabase local são padrão (iguais para todos), mas não vão para o registro público.
          supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector 2>&1 \
            | sed -E 's/(sb_(secret|publishable)_)[A-Za-z0-9_-]+/\1(oculta)/g; s/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/(oculta)/g' \
            | tee -a registros/banco.log
      - name: Testes do banco
        run: |
          set -o pipefail
          BANCO_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bash supabase/tests/local/rodar.sh 2>&1 | tee -a registros/banco.log
      - name: Testes das Edge Functions (login, cadastro, recuperação e proteções)
        run: |
          set -o pipefail
          bash supabase/tests/funcoes/testar.sh 2>&1 | tee -a registros/banco.log
      - name: Backup criptografado (banco local) e agendamento da limpeza
        run: |
          set -o pipefail
          openssl rand -hex 24 > "$RUNNER_TEMP/senha-teste"
          BACKUP_SENHA="$(cat "$RUNNER_TEMP/senha-teste")" ALVO=--local \
            bash ferramentas/backup/fazer_backup.sh "$RUNNER_TEMP/backup-teste" 2>&1 | tee -a registros/banco.log
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -tA \
            -c "select 'pg_cron: ' || coalesce(string_agg(jobname || ' ' || schedule, ', '), 'nenhum') from cron.job" \
            -c "select 'limpeza_modo: ' || valor from public.configuracao_plataforma where chave = 'limpeza_modo'" \
            2>&1 | tee -a registros/banco.log
      - name: Restaurar o backup num Supabase vazio e conferir as linhas
        run: |
          set -o pipefail
          supabase stop --no-backup >/dev/null
          BACKUP_SENHA="$(cat "$RUNNER_TEMP/senha-teste")" \
            bash ferramentas/backup/testar_restauracao.sh "$RUNNER_TEMP"/backup-teste/*.gpg 2>&1 | tee -a registros/banco.log
      - name: Guardar o registro
        if: always() && env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/banco.log
          gh release view registros -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create registros -R "$GITHUB_REPOSITORY" --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/banco.log --clobber
      - name: Parar
        if: always()
        run: supabase stop --no-backup || true

  nucleo:
    name: Núcleo de regras (análise e testes)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guardar o registro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Textos legais dos apps iguais aos de docs/legal (e versão igual à do banco)
        run: |
          python3 ferramentas/legal/gerar.py
          git diff --exit-code -- packages/visual/lib/src/textos_legais.dart apps/gestor/web/termos.html apps/gestor/web/privacidade.html \
            || { echo "::error::Rode python3 ferramentas/legal/gerar.py e envie os arquivos gerados."; exit 1; }
      - name: Análise e testes
        working-directory: packages/nucleo
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (dart pub get && dart analyze --fatal-infos && dart test) 2>&1 | tee ../../registros/nucleo.log
      - name: Guardar o registro
        if: always() && env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> registros/nucleo.log
          gh release view registros -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create registros -R "$GITHUB_REPOSITORY" --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/nucleo.log --clobber

  motorista:
    name: App do motorista (análise, testes e APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guardar o registro
    outputs:
      assinatura: ${{ steps.apk.outputs.assinatura }}
      impressao: ${{ steps.apk.outputs.impressao }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependências, análise e testes
        working-directory: apps/motorista
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (flutter pub get && flutter analyze --no-fatal-infos && flutter test --exclude-tags capturas) 2>&1 | tee ../../registros/motorista.log
      - name: Imagens das telas
        working-directory: apps/motorista
        continue-on-error: true
        run: flutter test --tags capturas --update-goldens 2>&1 | tail -5
      # Os símbolos da ofuscação (build/simbolos) não são publicados: com eles
      # daria para desfazer a ofuscação. Ficam só na máquina da esteira.
      - name: Compilar o APK (ofuscado, encolhido e assinado)
        id: apk
        working-directory: apps/motorista
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
        run: |
          set -o pipefail
          NUMERO=$((100 + ${{ github.run_number }}))
          bash ../../ferramentas/chaves/com_assinatura.sh flutter build apk --release --build-number=$NUMERO \
            --obfuscate --split-debug-info=build/simbolos 2>&1 | tee -a ../../registros/motorista.log
          mkdir -p ../../saida
          cp build/app/outputs/flutter-apk/app-release.apk ../../saida/Frota-Motorista.apk
          (cd test && zip -qr ../../../saida/telas-motorista.zip capturas) || true
          ls -la ../../saida
      - name: O APK não leva segredo e está assinado
        run: |
          set -o pipefail
          python3 ferramentas/seguranca/conferir_apk.py saida/Frota-Motorista.apk 2>&1 | tee -a registros/motorista.log
          ASSINADOR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$ASSINADOR" verify --print-certs saida/Frota-Motorista.apk | grep -E "SHA-256" | tee -a registros/motorista.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-motorista
          path: saida/
          retention-days: 14
      - name: Guardar o registro
        if: always() && env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | assinatura ${{ steps.apk.outputs.assinatura }} | resultado ${{ job.status }}" >> registros/motorista.log
          gh release view registros -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create registros -R "$GITHUB_REPOSITORY" --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/motorista.log --clobber

  gestor:
    name: App e painel do gestor (análise, testes, APK e site)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guardar o registro e publicar o painel no ramo gh-pages
    outputs:
      assinatura: ${{ steps.apk.outputs.assinatura }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Onde o painel web fica no ar
        id: painel
        env:
          TEM_TOKEN: ${{ secrets.PAINEL_TOKEN != '' }}
          DONO: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$TEM_TOKEN" = true ]; then
            { echo "repo=$DONO/$PAINEL_REPO_NOME"; echo "ramo=main"; echo "base=/$PAINEL_REPO_NOME/"; } >> "$GITHUB_OUTPUT"
            echo "url=https://$DONO.github.io/$PAINEL_REPO_NOME/" >> "$GITHUB_OUTPUT"
          else
            { echo "repo=$GITHUB_REPOSITORY"; echo "ramo=gh-pages"; echo "base=/$REPO/"; } >> "$GITHUB_OUTPUT"
            echo "url=https://$DONO.github.io/$REPO/" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependências, análise e testes
        working-directory: apps/gestor
        run: |
          set -o pipefail
          mkdir -p ../../registros
          (flutter pub get && flutter analyze --no-fatal-infos && flutter test --exclude-tags capturas) 2>&1 | tee ../../registros/gestor.log
      - name: Imagens das telas
        working-directory: apps/gestor
        continue-on-error: true
        run: flutter test --tags capturas --update-goldens 2>&1 | tail -5
      - name: Compilar o painel web
        working-directory: apps/gestor
        env:
          BASE: ${{ steps.painel.outputs.base }}
        run: |
          set -o pipefail
          flutter build web --release --base-href "$BASE" 2>&1 | tail -5 | tee -a ../../registros/gestor.log
          # Marca a versão publicada (a esteira confere depois se esta versão está no ar).
          echo "${GITHUB_SHA::7}" > build/web/versao.txt
      - name: Compilar o APK (ofuscado, encolhido e assinado)
        id: apk
        working-directory: apps/gestor
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
        run: |
          set -o pipefail
          NUMERO=$((100 + ${{ github.run_number }}))
          bash ../../ferramentas/chaves/com_assinatura.sh flutter build apk --release --build-number=$NUMERO \
            --obfuscate --split-debug-info=build/simbolos 2>&1 | tail -8 | tee -a ../../registros/gestor.log
          mkdir -p ../../saida
          cp build/app/outputs/flutter-apk/app-release.apk ../../saida/Frota-Gestor.apk
          (cd test && zip -qr ../../../saida/telas-gestor.zip capturas) || true
          ls -la ../../saida
      - name: O APK não leva segredo e está assinado
        run: |
          set -o pipefail
          python3 ferramentas/seguranca/conferir_apk.py saida/Frota-Gestor.apk 2>&1 | tee -a registros/gestor.log
          ASSINADOR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$ASSINADOR" verify --print-certs saida/Frota-Gestor.apk | grep -E "SHA-256" | tee -a registros/gestor.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-gestor
          path: saida/
          retention-days: 14
      - name: Publicar o painel web
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAINEL_TOKEN: ${{ secrets.PAINEL_TOKEN }}
          DESTINO: ${{ steps.painel.outputs.repo }}
          RAMO: ${{ steps.painel.outputs.ramo }}
        run: |
          cd apps/gestor/build/web
          touch .nojekyll
          printf '%s\n' "# Painel web da Plataforma de Gestão de Frota" "" \
            "Publicado sozinho pela esteira do repositório do código. Não edite aqui: cada publicação substitui tudo." \
            > README.md
          git init -q -b "$RAMO"
          git config user.name "esteira"
          git config user.email "esteira@users.noreply.github.com"
          git add -A
          git commit -q -m "Painel web do gestor (${GITHUB_SHA::7})"
          TOKEN="${PAINEL_TOKEN:-$GH_TOKEN}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${DESTINO}.git" "$RAMO"
          echo "commit ${GITHUB_SHA::7} | painel web publicado em $DESTINO ($RAMO)" >> ../../../../registros/gestor.log
      - name: Conferir o painel no ar
        if: env.PUBLICAR == 'true'
        continue-on-error: true
        env:
          URL_PAINEL: ${{ steps.painel.outputs.url }}
          BASE: ${{ steps.painel.outputs.base }}
        run: |
          # O GitHub Pages leva 1 ou 2 minutos para pôr a versão nova no ar.
          for i in $(seq 1 8); do
            sleep 30
            VERSAO=$(curl -s "${URL_PAINEL}versao.txt?v=$i" | tr -d '[:space:]')
            [ "$VERSAO" = "${GITHUB_SHA::7}" ] && break
          done
          CODIGO=$(curl -s -o painel.html -w '%{http_code}' "$URL_PAINEL")
          if [ "$VERSAO" = "${GITHUB_SHA::7}" ] && [ "$CODIGO" = 200 ] && grep -q "<base href=\"$BASE\"" painel.html; then
            echo "ok: painel no ar em $URL_PAINEL (versão ${GITHUB_SHA::7})" | tee -a registros/gestor.log
          else
            echo "FALHOU: painel em $URL_PAINEL respondeu $CODIGO, versão no ar '${VERSAO}' (GitHub Pages ligado?)" | tee -a registros/gestor.log
          fi
      - name: Conferir as Edge Functions na nuvem
        if: env.PUBLICAR == 'true'
        continue-on-error: true
        run: |
          F=https://uinvhwhqhudniipobslu.supabase.co/functions/v1
          K='apikey: sb_publishable_nM7GeKdmBtrk7VxUBk6s3A_e9Yc9Mdn'
          conferir() { # nome corpo esperado
            CODIGO=$(curl -s -o resposta.json -w '%{http_code}' -X POST "$F/$1" -H 'Content-Type: application/json' -H "$K" -d "$2")
            [ "$CODIGO" = "$3" ] && R=ok || R=FALHOU
            echo "$R: $1 respondeu $CODIGO (esperado $3): $(cat resposta.json)" | tee -a registros/gestor.log
          }
          # Só pedidos recusados na validação: nada é gravado no banco.
          conferir entrar_com_cpf '{"cpf":"123","senha":"x","aparelho":"esteira"}' 401
          conferir cadastrar_motorista '{"nome":"Teste","cpf":"123","senha":"x","aparelho":"esteira"}' 400
          conferir redefinir_acesso '{}' 401
          conferir criar_acesso_gestor '{}' 401
          conferir recuperar_acesso '{"identificador":"123","codigo":"x","senha_nova":"x"}' 400
          conferir pedir_link_senha '{"identificador":"123"}' 400
          # Versão nova no ar: senha sem número é recusada antes de gravar qualquer coisa,
          # e pedido grande demais é recusado.
          conferir cadastrar_motorista '{"nome":"Teste","cpf":"52998224725","senha":"semnumero","aparelho":"esteira"}' 400
          grep -q '"senha_fraca"' resposta.json && echo "ok: regra de senha nova no ar" | tee -a registros/gestor.log \
            || echo "FALHOU: regra de senha nova não está no ar" | tee -a registros/gestor.log
          conferir entrar_com_cpf "{\"cpf\":\"$(printf 'x%.0s' $(seq 1 20000))\"}" 413
          # CORS: só o painel recebe liberação (site estranho não).
          cors() { curl -s -o /dev/null -D - -X OPTIONS "$F/entrar_com_cpf" -H "$K" -H "Origin: $1" \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2; }
          [ -z "$(cors https://site-estranho.example)" ] && R=ok || R=FALHOU
          echo "$R: CORS para site estranho: '$(cors https://site-estranho.example)' (esperado vazio)" | tee -a registros/gestor.log
          [ "$(cors https://dasilvagonchoroskie-cpu.github.io)" = "https://dasilvagonchoroskie-cpu.github.io" ] && R=ok || R=FALHOU
          echo "$R: CORS para o painel: '$(cors https://dasilvagonchoroskie-cpu.github.io)'" | tee -a registros/gestor.log
      - name: Guardar o registro
        if: always() && env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "commit ${GITHUB_SHA::7} | assinatura ${{ steps.apk.outputs.assinatura }} | resultado ${{ job.status }}" >> registros/gestor.log
          gh release view registros -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create registros -R "$GITHUB_REPOSITORY" --prerelease --title "Registros da esteira (uso interno)" --notes "Registros das execuções. Não é o aplicativo."
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/gestor.log --clobber

  aparelho:
    name: Abrir os dois APKs num celular Android (emulador)
    needs: [motorista, gestor]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # guardar o resultado no Release "registros"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Liberar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baixar os APKs desta execução
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true
      - name: Abrir os apps no Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ferramentas/diagnostico/rodar.sh
      - name: Guardar o resultado
        if: always() && env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostico
          echo "commit ${GITHUB_SHA::7} | resultado ${{ job.status }}" >> diagnostico/resumo.txt
          zip -qr diagnostico.zip diagnostico
          gh release upload registros -R "$GITHUB_REPOSITORY" diagnostico.zip --clobber

  publicar:
    name: Publicar os APKs (só com a assinatura oficial e depois de abrir no emulador)
    needs: [motorista, gestor, aparelho]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publicar os APKs nos Releases
    steps:
      - name: Assinatura
        run: |
          echo "motorista: ${{ needs.motorista.outputs.assinatura }} | gestor: ${{ needs.gestor.outputs.assinatura }}"
          echo "impressão digital do certificado: ${{ needs.motorista.outputs.impressao }}"
          if [ "${{ needs.motorista.outputs.assinatura }}" != "oficial" ] || [ "${{ needs.gestor.outputs.assinatura }}" != "oficial" ]; then
            echo "::warning::APKs não publicados: falta o segredo CHAVE_MESTRA (veja docs/OPERACAO.md)."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.motorista.outputs.assinatura == 'oficial' && needs.gestor.outputs.assinatura == 'oficial'
        with:
          pattern: apk-*
          path: saida
          merge-multiple: true
      - name: Publicar nos Releases "motorista-teste" e "gestor-teste"
        if: needs.motorista.outputs.assinatura == 'oficial' && needs.gestor.outputs.assinatura == 'oficial'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R="-R $GITHUB_REPOSITORY"
          gh release view motorista-teste $R >/dev/null 2>&1 || gh release create motorista-teste $R --prerelease \
            --title "App do motorista - teste" --notes "APK do app do motorista (assinatura oficial). Versão da esteira."
          gh release view gestor-teste $R >/dev/null 2>&1 || gh release create gestor-teste $R --prerelease \
            --title "App do gestor - teste" --notes "APK do app do gestor e do dono (assinatura oficial). Versão da esteira."
          gh release upload motorista-teste $R saida/Frota-Motorista.apk --clobber
          gh release upload gestor-teste $R saida/Frota-Gestor.apk --clobber
          [ -f saida/telas-motorista.zip ] && gh release upload motorista-teste $R saida/telas-motorista.zip --clobber || true
          [ -f saida/telas-gestor.zip ] && gh release upload gestor-teste $R saida/telas-gestor.zip --clobber || true
          echo "APKs publicados (commit ${GITHUB_SHA::7})"
      - name: Etiquetas dos Releases apontam para esta versão
        if: needs.motorista.outputs.assinatura == 'oficial' && needs.gestor.outputs.assinatura == 'oficial'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cada Release fica preso ao commit dos APKs que ele tem (e o histórico de
          # antes da limpeza de 22/10/2026 deixa de ser referenciado).
          for t in motorista-teste gestor-teste registros ferramentas; do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" -f sha="$GITHUB_SHA" -F force=true \
              --jq '"etiqueta " + .ref + " -> " + .object.sha[0:7]' || echo "::notice::etiqueta $t não encontrada"
          done
