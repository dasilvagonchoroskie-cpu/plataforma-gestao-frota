name: Banco - backup diário e atualização na nuvem

# Roda sozinho, sem computador:
#   - todo dia às 02:30 (Brasília): backup criptografado do banco da nuvem,
#     antes da limpeza diária das 03:20, e teste de restauração dele;
#   - depois de cada Esteira verde no ramo main: backup e, com ele feito,
#     aplica as migrations pendentes e as regras de login (supabase/auth-nuvem.json);
#   - pelo botão "Run workflow" ("Executar fluxo de trabalho");
#   - quando este arquivo muda: só confere (backup e lista do que aplicaria,
#     sem aplicar nada).
# O registro (sem segredo nem dado pessoal) vai para o Release "registros"
# como banco-nuvem.log.
# O backup fica guardado nesta execução por 90 dias (fora do Supabase),
# criptografado com uma senha derivada da CHAVE_MESTRA. Leva os dados do app,
# os logins (sem sessões) e a limpeza agendada (ferramentas/backup/fazer_backup.sh).
# Segredos (Settings > Secrets and variables > Actions), nunca no código:
#   SUPABASE_ACCESS_TOKEN  token de acesso da conta do Supabase;
#   CHAVE_MESTRA           a chave única da plataforma (ferramentas/chaves/derivar.py).
# Sem eles, o fluxo só avisa e não faz nada.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/banco-nuvem.yml']
  schedule:
    - cron: '30 5 * * *'
  workflow_run:
    workflows: [Esteira]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [so-backup, backup-e-aplicar]
        default: so-backup
      confirmacao:
        description: 'Para aplicar no banco, digite APLICAR'
        required: false
        default: ''

permissions: {}

concurrency:
  group: banco-nuvem
  cancel-in-progress: false

env:
  PROJETO: uinvhwhqhudniipobslu
  SUPABASE_CLI_VERSION: '2.121.0'

jobs:
  banco:
    name: Backup criptografado e atualização do banco da nuvem
    # Depois da Esteira: só envio direto no main deste repositório (nunca
    # pedido de fora) e só se a Esteira passou inteira.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # só para guardar o registro no Release "registros"
    outputs:
      pronto: ${{ steps.segredos.outputs.pronto }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
    steps:
      - name: Conferir os segredos e o que fazer
        id: segredos
        env:
          EVENTO: ${{ github.event_name }}
          ACAO_PEDIDA: ${{ inputs.acao }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          FALTA=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && FALTA="$FALTA SUPABASE_ACCESS_TOKEN"
          [ -z "$CHAVE_MESTRA" ] && FALTA="$FALTA CHAVE_MESTRA"
          if [ -n "$CHAVE_MESTRA" ] && [ ${#CHAVE_MESTRA} -lt 12 ]; then
            echo "::warning::A CHAVE_MESTRA tem menos de 12 caracteres: troque por uma frase maior."
            FALTA="$FALTA CHAVE_MESTRA(curta)"
          fi
          if [ -n "$FALTA" ]; then
            echo "::warning::Faltam segredos do GitHub:$FALTA. Nada foi feito (docs/OPERACAO.md, 'Segredos do GitHub')."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENTO" in
            workflow_dispatch)
              ACAO="$ACAO_PEDIDA"
              if [ "$ACAO" = backup-e-aplicar ] && [ "$CONFIRMACAO" != APLICAR ]; then
                echo "::error::Para aplicar no banco, digite APLICAR no campo de confirmação."; exit 1
              fi ;;
            workflow_run) ACAO=backup-e-aplicar ;;
            push) ACAO=conferir ;;
            *) ACAO=so-backup ;;
          esac
          echo "o que fazer: $ACAO"
          { echo "pronto=sim"; echo "acao=$ACAO"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.segredos.outputs.pronto == 'sim'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.segredos.outputs.pronto == 'sim'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ligar ao projeto do Supabase (login temporário pelo token)
        if: steps.segredos.outputs.pronto == 'sim'
        run: |
          set -o pipefail
          mkdir -p registros
          echo "execução ${GITHUB_RUN_ID} | ${GITHUB_SHA::7} | ação ${{ steps.segredos.outputs.acao }}" > registros/banco-nuvem.log
          supabase --version 2>&1 | tee -a registros/banco-nuvem.log
          supabase link --project-ref "$PROJETO" 2>&1 | tee -a registros/banco-nuvem.log

      - name: Backup criptografado
        if: steps.segredos.outputs.pronto == 'sim'
        run: |
          BACKUP_SENHA=$(python3 ferramentas/chaves/derivar.py segredo frota-backup-v1)
          echo "::add-mask::$BACKUP_SENHA"
          export BACKUP_SENHA
          bash ferramentas/backup/fazer_backup.sh backup-nuvem > "$RUNNER_TEMP/backup.txt" 2>&1 \
            || { cat "$RUNNER_TEMP/backup.txt"; exit 1; }
          cat "$RUNNER_TEMP/backup.txt"
          # No registro público vai só o resumo (sem contagem de linhas por tabela).
          grep -E "^backup criptografado|^tabelas com linhas" "$RUNNER_TEMP/backup.txt" | tee -a registros/banco-nuvem.log

      - name: Guardar o backup (90 dias)
        if: steps.segredos.outputs.pronto == 'sim'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-frota-${{ github.run_id }}
          path: backup-nuvem/*.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Migrations que apagam dados têm aprovação do dono
        if: steps.segredos.outputs.acao == 'backup-e-aplicar' || steps.segredos.outputs.acao == 'conferir'
        run: |
          set -o pipefail
          python3 ferramentas/seguranca/conferir_aprovacao.py supabase/migrations 2>&1 | tee -a registros/banco-nuvem.log

      - name: Migrations pendentes
        if: steps.segredos.outputs.acao == 'backup-e-aplicar' || steps.segredos.outputs.acao == 'conferir'
        run: |
          set -o pipefail
          # Até 3 tentativas: o login temporário do Supabase às vezes demora a valer.
          for i in 1 2 3; do
            supabase db push --linked --include-all --dry-run 2>&1 | tee -a registros/banco-nuvem.log && break
            [ "$i" = 3 ] && exit 1
            echo "tentativa $i falhou; de novo em 30 s" | tee -a registros/banco-nuvem.log; sleep 30
          done

      - name: Aplicar as migrations pendentes
        if: steps.segredos.outputs.acao == 'backup-e-aplicar'
        run: |
          set -o pipefail
          # Cada migration entra na sua transação; repetir só aplica as que faltam.
          for i in 1 2 3; do
            supabase db push --linked --include-all --yes 2>&1 | tee -a registros/banco-nuvem.log && break
            [ "$i" = 3 ] && exit 1
            echo "tentativa $i falhou; de novo em 30 s" | tee -a registros/banco-nuvem.log; sleep 30
          done

      - name: Regras de login (senha forte, sessões, e-mails)
        if: steps.segredos.outputs.acao == 'backup-e-aplicar'
        env:
          # Com o segredo PAINEL_TOKEN, o painel fica no repositório público painel-frota
          # (a Esteira publica lá) e os links dos e-mails passam a abrir nele.
          PAINEL_URL: ${{ secrets.PAINEL_TOKEN != '' && format('https://{0}.github.io/painel-frota/', github.repository_owner) || '' }}
        run: |
          set -o pipefail
          python3 ferramentas/seguranca/aplicar_auth.py supabase/auth-nuvem.json 2>&1 | tee -a registros/banco-nuvem.log

      - name: Histórico de migrations na nuvem
        if: always() && steps.segredos.outputs.pronto == 'sim'
        run: supabase migration list --linked 2>&1 | tee -a registros/banco-nuvem.log

      - name: Guardar o registro (Release "registros")
        if: always() && steps.segredos.outputs.pronto == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "resultado: ${{ job.status }}" >> registros/banco-nuvem.log
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/banco-nuvem.log --clobber

  restauracao:
    name: Teste de restauração do backup (Supabase vazio)
    needs: banco
    if: needs.banco.outputs.pronto == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # só para guardar o registro no Release "registros"
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Versões dos serviços da nuvem (para o Supabase local ser igual)
        run: supabase link --project-ref "$PROJETO" && ls supabase/.temp
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backup-frota-${{ github.run_id }}
          path: backup
      - name: Restaurar e conferir as linhas de cada tabela
        run: |
          BACKUP_SENHA=$(python3 ferramentas/chaves/derivar.py segredo frota-backup-v1)
          echo "::add-mask::$BACKUP_SENHA"
          export BACKUP_SENHA
          set -o pipefail
          mkdir -p registros
          echo "execução ${GITHUB_RUN_ID} | ${GITHUB_SHA::7} | teste de restauração" > registros/banco-restauracao.log
          bash ferramentas/backup/testar_restauracao.sh backup/*.gpg "$PWD/supabase/.temp" 2>&1 | tee -a registros/banco-restauracao.log
      - name: Guardar o registro (Release "registros")
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "resultado: ${{ job.status }}" >> registros/banco-restauracao.log
          gh release upload registros -R "$GITHUB_REPOSITORY" registros/banco-restauracao.log --clobber
