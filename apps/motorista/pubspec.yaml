name: motorista
description: App do motorista da Plataforma de Gestão de Frota.
publish_to: none
version: 0.7.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nucleo:
    path: ../../packages/nucleo
  visual:
    path: ../../packages/visual
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  supabase_flutter: 2.18.3
  drift: 2.35.2
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  share_plus: 13.3.1
  connectivity_plus: 7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2

flutter:
  uses-material-design: true

  # As letras ficam no pacote nucleo (o gerador de PDF lê pelo mesmo caminho).
  fonts:
    - family: Barlow
      fonts:
        - asset: packages/nucleo/fontes/Barlow-Regular.ttf
          weight: 400
        - asset: packages/nucleo/fontes/Barlow-Medium.ttf
          weight: 500
        - asset: packages/nucleo/fontes/Barlow-SemiBold.ttf
          weight: 600
        - asset: packages/nucleo/fontes/Barlow-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: packages/nucleo/fontes/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: packages/nucleo/fontes/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: packages/nucleo/fontes/BarlowSemiCondensed-Bold.ttf
          weight: 700
