<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Arte do ícone Frota Gestor: barras subindo (resultado da frota) sobre um caminhão. -->
  <g id="arte">
    <!-- barras -->
    <rect x="236" y="470" width="132" height="170" rx="18" fill="#FFFFFF"/>
    <rect x="446" y="370" width="132" height="270" rx="18" fill="#FFFFFF"/>
    <rect x="656" y="250" width="132" height="390" rx="18" fill="#2FB574"/>
    <!-- linha de tendência -->
    <polyline points="250,400 460,300 640,210" fill="none" stroke="#F2B300" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M600 168 L720 178 L668 286 Z" fill="#F2B300"/>
    <!-- caminhão pequeno na base -->
    <rect x="236" y="676" width="372" height="96" rx="14" fill="#FFFFFF"/>
    <path d="M622 704 h96 c12 0 22 6 27 17 l34 51 v0 H622 z" fill="#FFFFFF"/>
    <rect x="236" y="786" width="552" height="18" rx="9" fill="#FFFFFF"/>
    <g fill="#1E2427" stroke="#FFFFFF" stroke-width="12">
      <circle cx="318" cy="812" r="36"/>
      <circle cx="420" cy="812" r="36"/>
      <circle cx="700" cy="812" r="36"/>
    </g>
  </g>
</svg>
