<div style="font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5;color:#1d2420;max-width:520px">
  <h2 style="color:#0b6b3a;margin:0 0 12px">Confirme o seu e-mail</h2>
  <p>Este e-mail foi cadastrado na Plataforma de Gestão de Frota para você recuperar a senha quando precisar.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}?token_hash={{ .TokenHash }}&type=email_change"
       style="background:#0b6b3a;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:8px;font-weight:bold;display:inline-block">
      Confirmar o e-mail
    </a>
  </p>
  <p>O link vale por 1 hora e só funciona uma vez.</p>
  <p style="color:#5b665f;font-size:15px">Não foi você? Ignore este e-mail: nada muda.</p>
</div>
