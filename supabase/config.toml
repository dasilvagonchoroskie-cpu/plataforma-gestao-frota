# Configuração do Supabase local (testes na esteira). O projeto de verdade
# fica na conta gestaodefrota2027@gmail.com; nenhum segredo vai aqui.
project_id = "plataforma-gestao-frota"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "30s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Seu código de acesso"
content_path = "./supabase/templates/codigo.html"

[auth.email.template.confirmation]
subject = "Seu código de acesso"
content_path = "./supabase/templates/codigo.html"

[auth.email.template.recovery]
subject = "Código para criar uma senha nova"
content_path = "./supabase/templates/recuperar.html"

[auth.sms]
enable_signup = false

[functions.entrar_com_cpf]
verify_jwt = false

[functions.redefinir_acesso]
verify_jwt = false

[functions.cadastrar_motorista]
verify_jwt = false

[functions.criar_acesso_gestor]
verify_jwt = false

[functions.recuperar_acesso]
verify_jwt = false
